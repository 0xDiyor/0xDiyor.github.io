name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly rebuild so build-time GitHub data (pinned repos and the
    # contribution graph on /projects/) stays at most a day old
    - cron: '0 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: back-to-back pushes queue instead of racing.
# In-progress deploys aren't cancelled, so a half-finished one never ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Required by src/data/github.ts: pinned repos and the contribution
      # graph come from the GraphQL API, which only accepts authenticated
      # requests. Without it the build still passes but leaves both out.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
